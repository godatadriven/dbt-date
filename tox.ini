[tox]
skipsdist = True
envlist = testenv, dbt_integration_{bigquery,databricks,clickhouse,duckdb,postgres,spark,trino}, dbt_integration_fusion_{bigquery,databricks}, fusion_integration_{bigquery,databricks}

[testenv]
passenv =
    DBT_SUFFIX

    BIGQUERY_KEYFILE_JSON
    BIGQUERY_PROJECT
    BIGQUERY_SCHEMA

    CLICKHOUSE_HOST
    CLICKHOUSE_PORT
    CLICKHOUSE_SCHEMA
    CLICKHOUSE_USER

    DBT_ENV_SECRET_DATABRICKS_TOKEN
    DATABRICKS_HTTP_PATH
    DATABRICKS_HOST
    DATABRICKS_SCHEMA

    DBT_ENV_SECRET_POSTGRES_PASS
    POSTGRES_DATABASE
    POSTGRES_HOST
    POSTGRES_PORT
    POSTGRES_SCHEMA
    POSTGRES_USER

    SPARK_HOST
    SPARK_METHOD
    SPARK_PORT
    SPARK_SCHEMA
    SPARK_USER

    DBT_ENV_SECRET_TRINO_PASS
    TRINO_CATALOG
    TRINO_HOST
    TRINO_METHOD
    TRINO_PORT
    TRINO_SCHEMA
    TRINO_TIMEZONE
    TRINO_USER

[testenv:dbt_integration_bigquery]
changedir = integration_tests
allowlist_externals =
    dbt
skip_install = true
commands =
    dbt debug --target bigquery
    dbt deps
    dbt build --target bigquery --full-refresh # Single run as a new dataset is created for every run

