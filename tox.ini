# Envs named to match dbt-package-testing's run_tox_fusion.yml, which invokes
# `tox -e dbt_integration_fusion_<adapter>` (the core convention is `dbt_integration_<adapter>`).
# These mirror the fusion_integration_* envs above; kept separate to stay scoped to the test PR.
[testenv:dbt_integration_fusion_bigquery]
changedir = integration_tests
allowlist_externals =
    bash
    dbt
skip_install = true
commands =
    # Fusion's service-account method reads ./service-key-file.json; run_tox_fusion.yml passes
    # BIGQUERY_KEYFILE_JSON as an env var only, so materialise the keyfile before dbt runs.
    bash -c 'printf "%s" "$BIGQUERY_KEYFILE_JSON" > service-key-file.json'
    dbt debug --target bigquery-fusion
    dbt deps
    dbt build --target bigquery-fusion --full-refresh # Single run as a new dataset is created for every run

[testenv:dbt_integration_fusion_databricks]
changedir = integration_tests
allowlist_externals =
    dbt
skip_install = true
commands =
    dbt debug --target databricks
    dbt deps
    dbt build --target databricks --full-refresh # Single run as a new dataset is created for every run
