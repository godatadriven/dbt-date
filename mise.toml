# Task definitions consumed by dbt-package-testing's run_tox.yml when called
# with test_runner: "mise". Task names follow the convention that workflow
# expects: test:<adapter> (and test:fusion-<adapter> for the Fusion workflow).
#
# No [tools] section on purpose: the reusable workflow installs dbt into uv's
# system Python (uv pip install --system). Pinning a Python here would make
# `mise run` execute under a different interpreter that has no dbt installed.

[tasks."test:duckdb"]
description = "Run integration tests for DuckDB"
dir = "integration_tests"
run = [
    "dbt debug --target duckdb",
    "dbt deps",
    "dbt run --target duckdb",
    "dbt test --target duckdb",
]

[tasks."test:postgres"]
description = "Run integration tests for Postgres"
dir = "integration_tests"
run = [
    "dbt debug --target postgres",
    "dbt deps",
    "dbt run --target postgres",
    "dbt test --target postgres",
]

[tasks."test:fusion-bigquery"]
description = "Run Fusion integration tests for BigQuery"
dir = "integration_tests"
run = [
    # Fusion's service-account method reads a keyfile on disk (./service-key-file.json),
    # not the BIGQUERY_KEYFILE_JSON env var. run_tox_fusion.yml passes the secret only as
    # an env var and offers no pre-step hook, so the consumer must materialise the file here.
    "printf '%s' \"$BIGQUERY_KEYFILE_JSON\" > service-key-file.json",
    "dbt debug --target bigquery-fusion",
    "dbt deps",
    "dbt build --target bigquery-fusion --full-refresh",
]

[tasks."test:fusion-databricks"]
description = "Run Fusion integration tests for Databricks"
dir = "integration_tests"
run = [
    "dbt debug --target databricks",
    "dbt deps",
    "dbt build --target databricks --full-refresh",
]
